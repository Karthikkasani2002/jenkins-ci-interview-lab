apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: upi-lab-root
  namespace: argocd
spec:
  project: upi-lab-bootstrap
  source:
    repoURL: https://github.com/Karthikkasani2002/jenkins-ci-interview-lab.git
    targetRevision: main
    path: deploy/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
