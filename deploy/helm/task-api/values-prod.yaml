# Reference only: the sample API is in-memory and is not a payment service.
environment: production
replicaCount: 2
imagePullSecrets:
  - name: ghcr-pull
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: task-api
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: task-api
image:
  repository: ghcr.io/karthikkasani2002/jenkins-ci-interview-lab
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
ingress:
  enabled: true
  className: nginx
  host: replace-with-approved-internal-host.example
  tls:
    enabled: true
    secretName: replace-with-managed-tls-secret
autoscaling:
  enabled: false
